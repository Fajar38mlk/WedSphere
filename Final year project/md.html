<!DOCTYPE html>
<html lang="en">
<head>

<title>MD Palace</title>

<link rel="stylesheet" href="mughal.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

</head>

<body>

<!-- NAVBAR -->
<header class="navbar">
  <h2>Wed Sphere</h2>
  <nav>
    <a href="index.html">Home</a>
    <a href="hall listing.html">Halls</a>
    <a href="about.html">About</a>
    <a href="login.html">Login</a>
    <div class="user-menu">
    <span class="user-icon">👤</span>
    <div class="dropdown">
      <a href= "login.html">Sign in</a>
      <a href="register.html">Hall Manager Login</a>
    </div>
    </div>
  </nav>
</header>

<!-- MAIN -->
<section class="detail-page">

  <!-- IMAGE -->
  <div class="detail-img">
    <img src="md palace.jpg">
  </div>

  <!-- DETAILS -->
  <div class="detail-box">
    <h2>MD Palace</h2>

    <p><b>Price:</b> Rs 70,000</p>
    <p><b>Capacity:</b> 350 Guests</p>
    <p><b>Location:</b>  Near Sailkot Bypass,Near GT Road</p>

    <!-- TIME -->
    <label>Time Slot</label>
    <select>
      <option>Morning</option>
      <option>Evening</option>
    </select>

    <!-- EVENT -->
    <label>Event</label>
    <select>
      <option>Wedding</option>
      <option>Engagement</option>
    </select>

    <!-- MENU -->
    <label>Menu</label>
    <div class="check">
      <label><input type="checkbox"> Mutton Biryani </label>
      <label><input type="checkbox"> Chicken Handi</label>
      <label><input type="checkbox"> BBQ Platte</label>
    </div>

    <!-- FACILITIES -->
    <label>Facilities</label>
    <div class="check">
      <label><input type="checkbox"> AC</label>
      <label><input type="checkbox"> Parking</label>
      <label><input type="checkbox"> Bridal Room</label>
    </div>

    <!-- MAP -->
    <iframe src="https://maps.google.com/maps?q=gujranwala&output=embed"></iframe>

    <button class="button" onclick="window.location.href='login.html'">Book Now</button>
  </div>

</section>

<script src="script.js"></script>
