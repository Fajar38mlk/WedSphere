<!-- TITLE -->
<h2 class="bk">Book Your Event</h2>

<!-- FORM -->
<div class="booking-container">

    <form id="bookingForm">

        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label>Select Event Type</label>
        <select id="event" required>
            <option value="">-- Select Event --</option>
            <option value="wedding">Wedding</option>
            <option value="engagement">Engagement</option>
        </select>

        <label>Select Date</label>
        <input type="date" id="date" required>

        <label>Select Time</label>
        <select id="time" required>
            <option value="">-- Select Time --</option>
            <option value="12-4">12 PM - 4 PM(Evening)</option>
            <option value="7-10">7 PM - 10 PM(Night)</option>
        </select>

        <label>Number of Guests</label>
        <input type="number" id="guests" placeholder="e.g. 300" required>

        <button type="button" onclick="checkAvailability()">Check Availability</button>

        <p id="message"></p>

        <button type="button" onclick="submitBooking()">Confirm Booking</button>

    </form>

</div>

<script src="booking.js"></script>
<script src="main.js"></script>

</body>
</html>
