<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Wed Sphere</title>

<link rel="stylesheet" href="login.css">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

</head>

<body>

<!-- NAVBAR (same everywhere) -->
<header class="navbar">
    <h2 class="logo">Wed Sphere</h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="hall listing.html">Halls</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <div class="user-menu">
    <span class="user-icon">👤</span>
    <div class="dropdown">
      <a href= "login.html">Sign in</a>
      <a href="register.html">Hall Manager Login</a>
    </div>
    </div>
    </nav>
</header>

<!-- MAIN LOGIN CARD -->
<div class="main-card">

  <!-- LEFT SIDE -->
  <div class="left-side">

    <h1>Welcome Back</h1>

    <p>
      Login to explore luxury wedding halls,
      manage bookings and make your special
      day unforgettable ✨
    </p>

    <div class="features">

      <div class="feature-box">
        💎 Luxury Halls
      </div>

      <div class="feature-box">
        📅 Easy Booking
      </div>

      <div class="feature-box">
        🎉 Premium Events
      </div>

    </div>

  </div>


  <!-- RIGHT SIDE -->
  <div class="right-side">

    <h2>Login Account</h2>

    <input type="email" id="email" placeholder="Enter Email">

    <div class="password-box">

      <input type="password" id="password" placeholder="Enter Password">

      <span onclick="togglePassword()">👁️</span>

    </div>

  <button onclick="loginUser()" class="login-btn">
  Login
  </button>

    <button onclick="googleLogin()" class="google-btn">
      Continue with Google
    </button>

    <p class="signup-text">
      Don't have an account?
      <a href="signup.html">Signup</a>
    </p>

  </div>

</div>

<script src="login.js"></script>
<script src="main.js"></script>

</body>
</html>
